services:
  # =========================================================
  # 1. API (FastAPI)
  # =========================================================
  - type: web
    name: secureaudit-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secureaudit-db
          property: connectionString
      - key: SYSTEM_DATABASE_URL
        fromDatabase:
          name: secureaudit-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://secureaudit-web.vercel.app"
    healthCheckPath: /health

  # =========================================================
  # 2. Worker (Scanner)
  # =========================================================
  - type: worker
    name: secureaudit-worker
    runtime: docker
    dockerfilePath: ./services/scanner-worker/Dockerfile
    dockerContext: ./services/scanner-worker
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secureaudit-db
          property: connectionString
      - key: SYSTEM_DATABASE_URL
        fromDatabase:
          name: secureaudit-db
          property: connectionString

# =========================================================
# 3. PostgreSQL
# =========================================================
databases:
  - name: secureaudit-db
    plan: free
    region: oregon
    databaseName: secureaudit
    user: secureaudit
